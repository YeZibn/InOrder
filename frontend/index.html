<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InOrder · 工作流测试台</title>
  <style>
    :root { color-scheme: dark; --bg:#0e1420; --panel:#151e2d; --line:#2a3a52; --muted:#8fa1b8; --accent:#65d6ad; --danger:#ff8c8c; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:linear-gradient(135deg,#0d1420,#17243a); color:#eef5ff; min-height:100vh; }
    .shell { max-width:1400px; margin:0 auto; padding:24px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; }
    h1 { margin:0; font-size:26px; } h1 span { color:var(--accent); }
    .subtitle { color:var(--muted); font-size:13px; margin-top:5px; }
    .toolbar, .composer, .panel { background:rgba(21,30,45,.92); border:1px solid var(--line); border-radius:14px; box-shadow:0 12px 30px rgba(0,0,0,.15); }
    .toolbar { padding:12px 14px; display:flex; align-items:center; gap:10px; }
    label { color:var(--muted); font-size:13px; } input, textarea, button { font:inherit; }
    input, textarea { color:#eef5ff; background:#0d1523; border:1px solid var(--line); border-radius:9px; padding:10px 12px; outline:none; }
    input:focus, textarea:focus { border-color:var(--accent); } #session { width:170px; }
    button { cursor:pointer; border:1px solid var(--line); border-radius:9px; color:#eef5ff; background:#23334a; padding:9px 14px; }
    button.primary { background:#168a6c; border-color:#42c79f; } button.danger { color:#ffd0d0; }
    button:disabled { cursor:not-allowed; opacity:.55; }
    .grid { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(320px,.8fr); gap:16px; margin-top:16px; }
    .panel { padding:16px; min-width:0; } .panel h2 { margin:0 0 12px; font-size:16px; }
    #messages { min-height:450px; max-height:62vh; overflow:auto; display:flex; flex-direction:column; gap:12px; }
    .bubble { padding:12px 14px; border-radius:12px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .bubble.user { background:#1b4d58; align-self:flex-end; max-width:82%; } .bubble.assistant { background:#202d42; }
    .bubble.system { background:#182331; color:#c0d1e4; font-size:13px; border-left:3px solid var(--accent); }
    .progress-current { color:#ffe09b; }
    .progress-history { display:flex; flex-direction:column; gap:4px; margin-top:7px; color:#9fb2c8; font-size:12px; }
    .progress-done::before { content:'✓ '; color:var(--accent); }
    .meta { color:var(--muted); font-size:11px; margin-bottom:5px; } .error { color:var(--danger); }
    .composer { margin-top:16px; padding:12px; display:flex; gap:10px; align-items:flex-end; }
    textarea { flex:1; resize:vertical; min-height:52px; max-height:180px; }
    .json { margin:0; max-height:290px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; color:#c8f5df; font:12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .status { color:var(--muted); font-size:12px; min-height:18px; } .status.busy { color:#ffe09b; }
    .small-actions { display:flex; gap:8px; margin-bottom:10px; }
    @media (max-width:850px) { .shell{padding:14px}.grid{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.composer{align-items:stretch;flex-direction:column} #messages{max-height:none}.user{max-width:95%} }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><h1><span>InOrder</span> 工作流测试台</h1><div class="subtitle">浏览器内存会话 · POST + SSE · 不写入数据库</div></div>
      <button id="clear" class="danger">清空会话</button>
    </header>
    <section class="toolbar">
      <label for="session">Session ID</label><input id="session" value="demo" autocomplete="off">
      <span id="status" class="status">就绪</span>
    </section>
    <div class="grid">
      <section>
        <div id="messages" class="panel" aria-live="polite"><div class="status">输入一条消息开始测试。</div></div>
        <form id="composer" class="composer">
          <textarea id="message" placeholder="例如：我要运一吨苹果从温州到上海" required></textarea>
          <button id="send" class="primary" type="submit">发送</button>
        </form>
      </section>
      <aside>
        <section class="panel"><h2>OrderContext</h2><pre id="context" class="json">{}</pre></section>
        <section class="panel" style="margin-top:16px"><h2>HistoryConversation</h2><pre id="history" class="json">{ "turns": [] }</pre></section>
        <section class="panel" style="margin-top:16px"><h2>订单摘要</h2><div id="summary" class="bubble-content">暂无</div></section>
        <section class="panel" style="margin-top:16px"><h2>最终结果</h2><pre id="result" class="json">暂无</pre></section>
      </aside>
    </div>
  </main>
  <script>
    (() => {
      const initial = () => ({ session_id: 'demo', history: { turns: [] }, order_context: {}, messages: [] });
      const state = initial();
      const $ = id => document.getElementById(id);
      const messages = $('messages'), status = $('status'), send = $('send'), input = $('message');
      const pretty = value => JSON.stringify(value ?? {}, null, 2);
      const renderState = () => { $('session').value = state.session_id; $('context').textContent = pretty(state.order_context); $('history').textContent = pretty(state.history); };
      const addBubble = (kind, title, text) => { const box=document.createElement('div'); box.className='bubble '+kind; box.innerHTML='<div class="meta"></div><div class="bubble-content"></div>'; box.querySelector('.meta').textContent=title; box.querySelector('.bubble-content').textContent=text; messages.appendChild(box); messages.scrollTop=messages.scrollHeight; return box; };
      const getOrderSummary = result => { const order = result?.order_result || {}; return order.order_summary || result?.order_summary || null; };
      const getOrderUserMessage = result => { const summary = getOrderSummary(result); return typeof summary?.user_message === 'string' && summary.user_message.trim() ? summary.user_message.trim() : ''; };

      // Only these public stages are exposed in the UI. Internal node names and
      // model-provided titles are deliberately ignored to keep the hint stable.
      const STAGE_HINTS = {
        start: '正在理解您的需求…',
        intent: '正在识别您的运输需求…',
        order: '正在整理订单信息…',
        cargo_profile: '正在分析货物特征…',
        vehicle: '正在匹配合适车型…',
        complete: '处理完成'
      };
      const STAGE_ALIASES = {
        intent_subgraph: 'intent',
        order_subgraph: 'order',
        rewrite: 'order',
        extract: 'order',
        update_context: 'order',
        vehicle_resolution: 'vehicle'
      };
      const NODE_HINTS = {
        main_intent: '主意图识别完成',
        sub_intent: '子意图解析完成',
        build_plan: '意图处理计划完成',
        validate_plan: '意图信息校验完成',
        rewrite: '订单语义整理完成',
        extract: '订单字段提取完成',
        update_context: '订单信息更新完成',
        cargo_profile: '货物画像生成完成',
        vehicle_resolution: '车型匹配完成',
        order_completeness: '订单信息检查完成',
        finalize: '订单处理结果整理完成'
      };
      const normalizeStage = stage => {
        const value = String(stage || '').trim().toLowerCase();
        return STAGE_HINTS[value] ? value : (STAGE_ALIASES[value] || 'unknown');
      };
      const friendlyHint = event => {
        const type = String(event?.type || '');
        const payload = event?.payload || {};
        if (type === 'THINKING_START') return STAGE_HINTS.start;
        if (type === 'THINKING_STEP') return NODE_HINTS[String(payload.node || '').toLowerCase()] || STAGE_HINTS[normalizeStage(payload.stage)] || '正在处理您的订单…';
        if (type === 'CREATE_ORDER_CONTEXT') return '订单信息已更新';
        if (type === 'THINKING_DONE' || type === 'DONE') return STAGE_HINTS.complete;
        if (type === 'ERROR') return payload.message || '处理失败，请稍后重试';
        return null;
      };
      const setProgressHint = (liveBox, hint, terminal=false, appendPrevious=false) => {
        if (!liveBox || !hint) return;
        const current = liveBox.querySelector('.progress-current');
        const history = liveBox.querySelector('.progress-history');
        if (!current || !history) { liveBox.querySelector('.bubble-content').textContent = hint; return; }
        if (current.textContent && !terminal && (appendPrevious || current.textContent !== hint)) {
          const completed = document.createElement('div');
          completed.className = 'progress-done';
          completed.textContent = current.textContent;
          history.appendChild(completed);
        }
        current.textContent = hint;
        if (terminal) current.classList.add('terminal');
        messages.scrollTop=messages.scrollHeight;
      };
      const createProgressBubble = () => {
        const box = addBubble('system', '处理中', '');
        const content = box.querySelector('.bubble-content');
        content.innerHTML = '<div class="progress-current"></div><div class="progress-history"></div>';
        return box;
      };
      const addEvent = (event, liveBox) => {
        const p = event.payload || {};
        const hint = friendlyHint(event);
        if (event.type === 'THINKING_START' || event.type === 'THINKING_STEP') { if (liveBox) setProgressHint(liveBox, hint, false, event.type === 'THINKING_STEP' && Boolean(p.node)); else addBubble('system','处理中',hint); }
        else if (event.type === 'CREATE_ORDER_CONTEXT') { state.order_context = p.order_context || state.order_context; renderState(); if (liveBox) setProgressHint(liveBox, hint); }
        else if (event.type === 'DONE') { const result=p.result || {}; state.last_result=result; const order=result.order_result || {}; const orderSummary=getOrderSummary(result); const userMessage=getOrderUserMessage(result); if (order && order.order_context) state.order_context=order.order_context; if (p.history) { state.history=p.history; state.history_from_server=true; } if (orderSummary) { $('summary').textContent=orderSummary.user_message || orderSummary.summary || '订单已解析'; } $('result').textContent=pretty(result); renderState(); if (liveBox) setProgressHint(liveBox, hint, true); if (userMessage && (!liveBox || liveBox.dataset.summaryAdded !== 'true')) { if (liveBox) liveBox.dataset.summaryAdded='true'; addBubble('assistant','InOrder',userMessage); state.messages.push({role:'assistant',content:userMessage}); } }
        else if (event.type === 'ERROR') { if (liveBox) { liveBox.classList.add('error'); setProgressHint(liveBox, hint, true); } else addBubble('system error','错误',hint); }
        if (event.type === 'THINKING_DONE' && liveBox) setProgressHint(liveBox, hint, true);
      };
      const parseSse = async (response, onEvent) => { if (!response.ok) throw new Error('HTTP '+response.status); if (!response.body) throw new Error('浏览器不支持流式响应'); const reader=response.body.getReader(), decoder=new TextDecoder(); let buffer=''; while(true){ const {value,done}=await reader.read(); buffer += decoder.decode(value||new Uint8Array(),{stream:!done}); const frames=buffer.split('\n\n'); buffer=frames.pop()||''; for(const frame of frames){ const line=frame.split('\n').find(x=>x.startsWith('data:')); if(!line) continue; try{ onEvent(JSON.parse(line.slice(5).trim())); }catch(e){ console.warn('invalid SSE frame',frame); } } if(done) break; } };
      $('composer').addEventListener('submit', async e => { e.preventDefault(); const text=input.value.trim(); if(!text){ addBubble('system error','提示','请输入消息'); return; } state.session_id=$('session').value.trim()||'demo'; state.history_from_server=false; state.messages.push({role:'user',content:text}); addBubble('user','用户',text); const historyBefore=JSON.parse(JSON.stringify(state.history)); const live=createProgressBubble(); setProgressHint(live, STAGE_HINTS.start); input.value=''; send.disabled=true; status.textContent='处理中…'; status.className='status busy'; let failed=false; try { const response=await fetch('/api/v2/chat',{method:'POST',headers:{'Accept':'text/event-stream','Content-Type':'application/json'},body:JSON.stringify({session_id:state.session_id,message:text,history:historyBefore,order_context:state.order_context,reference_time:state.order_context.reference_time||null})}); await parseSse(response,event=>{ if(event.type==='ERROR') failed=true; addEvent(event,live); }); if(!failed && !state.history_from_server){ const summary=getOrderUserMessage(state.last_result) || (state.last_result?.order_result?'订单信息已更新。':'已完成意图识别。'); state.history.turns.push({role:'user',content:text},{role:'assistant',content:summary}); renderState(); } } catch(err) { failed=true; live.classList.add('error'); setProgressHint(live, err.message||'网络请求失败', true); } finally { send.disabled=false; status.textContent=failed?'请求失败':'就绪'; status.className='status'+(failed?' error':''); input.focus(); } });
      $('clear').addEventListener('click',()=>{ const session=$('session').value.trim()||'demo'; Object.assign(state,initial(),{session_id:session}); messages.innerHTML='<div class="status">会话已清空。</div>'; $('summary').textContent='暂无'; $('result').textContent='暂无'; renderState(); });
      $('session').addEventListener('change',()=>{ state.session_id=$('session').value.trim()||'demo'; }); renderState();
    })();
  </script>
</body>
</html>
