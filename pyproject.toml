[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inorder-llm"
version = "0.1.0"
description = "OpenAI-compatible LLM client foundation for InOrder"
requires-python = ">=3.9"
dependencies = ["openai>=2.26,<3.0", "python-dotenv>=1.0,<2.0", "langgraph>=1.0,<2.0", "langextract==1.6.0", "rapidfuzz>=3.14,<4.0", "fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
llm-verify = "inorder_llm.commands.llm_verify:main"
llm-once = "inorder_llm.commands.llm_once:main"
llm-tools = "inorder_llm.commands.llm_tools:main"
inorder = "inorder_llm.commands.intent_chat:main"
inorder-api = "inorder_llm.commands.api_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inorder_llm.catalog" = ["data/*.json"]

[tool.pytest.ini_options]
markers = [
    "integration: live LLM gateway probe (opt-in with INORDER_LLM_LIVE_TESTS=1)",
]
